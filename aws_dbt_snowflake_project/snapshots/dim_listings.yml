snapshots:
    - name: dim_listings
      relation: ref('listings')
      config:
        schema: gold
        database: AIRBNB
        unique_key: LISTING_ID
        # 'check' compares these columns between runs. The old 'timestamp' strategy keyed
        # on a created-at column that never changes, so updates were never captured.
        strategy: check
        check_cols: [PROPERTY_TYPE, ROOM_TYPE, CITY, COUNTRY, PRICE_PER_NIGHT_TAG]
        dbt_valid_to_current: "to_date('9999-12-31')"
